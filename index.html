            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* 🫧 Bong bóng long lanh lơ lửng */
        .bubble-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(236, 72, 153, 0.4) 40%, rgba(168, 85, 247, 0.1) 80%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: floatUp 10s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* ✨ Vật liệu Cyber-Card có viền sáng Neon & Glassmorphism VIP */
        .cyber-card {
            background: linear-gradient(135deg, rgba(30, 20, 58, 0.75) 0%, rgba(12, 8, 26, 0.9) 100%);
            border: 1px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Quệt sáng khi hover (Shimmer) */
        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.6s;
        }

        .cyber-card:hover::before {
            left: 100%;
        }

        .cyber-card:hover {
            border-color: rgba(236, 72, 153, 0.8);
            box-shadow: 0 12px 30px -5px rgba(168, 85, 247, 0.5), 0 0 20px rgba(236, 72, 153, 0.4);
            transform: translateY(-3px) scale(1.005);
        }

        /* Nút Phát Sáng Neon Rực Rỡ */
        .glow-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #00f0ff 100%);
            background-size: 200% 200%;
            box-shadow: 0 0 18px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
            animation: glowGradient 4s ease infinite;
        }

        @keyframes glowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            transform: scale(1.04);
        }

        .heart-btn.active i {
            color: #ec4899;
            filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.9));

        /* Tag Style Custom Color */

            display: inline-flex;
            align-items: center;
            gap: 4px;

        ::-webkit-scrollbar-thumb { background: #2e1f54; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ec4899; }
    </style>

        const defaultTagColors = {
    "IPA": {
        "bg": "#000000",
        "text": "#ffffff",
        "border": "#81137d"
    },
    "IOS🍏": {
        "bg": "#000000",
        "text": "#ffffff",
        "border": "#d4ff00"
    },
    "TOOL": {
        "bg": "#000000",
        "text": "#ffffff",
        "border": "#002fff"
    },
    "PC": {
        "bg": "#000000",
        "text": "#ffffff",
        "border": "#00fffb"
    }
};

        let allTools = [];
        let tagColors = {};
        let isAdmin = false;
        let currentEditingTag = "";

        document.addEventListener('DOMContentLoaded', () => {
            loadSiteMetadata();
            loadTagColorsData();
            loadToolsData();
            checkAdminSession();

            document.getElementById('tag-bg-color').addEventListener('input', (e) => { document.getElementById('tag-bg-text').value = e.target.value; });
            document.getElementById('tag-text-color').addEventListener('input', (e) => { document.getElementById('tag-text-text').value = e.target.value; });
            document.getElementById('tag-border-color').addEventListener('input', (e) => { document.getElementById('tag-border-text').value = e.target.value; });
        });

        function loadSiteMetadata() {
            const savedName = localStorage.getItem('nsmod_site_name');
            const savedSub = localStorage.getItem('nsmod_site_sub');
            const savedLogo = localStorage.getItem('nsmod_site_logo');

            if (savedName) {
                document.getElementById('site-name').textContent = savedName;
                document.getElementById('page-title').textContent = savedName + ' - Bio Link VIP';
            }
            if (savedSub) {
                document.getElementById('site-sub').textContent = savedSub;
            }
            if (savedLogo) {
                document.getElementById('site-logo').src = savedLogo;
                document.getElementById('site-favicon').href = savedLogo;
            }
        }

        function loadTagColorsData() {
            const stored = localStorage.getItem('nsmod_tag_colors');
            if (stored) {
                try { tagColors = JSON.parse(stored); } catch(e) { tagColors = defaultTagColors; }
            } else {
                tagColors = defaultTagColors;
            }
        }

        function saveTagColorsData() {
            localStorage.setItem('nsmod_tag_colors', JSON.stringify(tagColors));
        }

        function editSiteInfo() {
            if (!isAdmin) return;
            const currentName = document.getElementById('site-name').textContent;
            const currentSub = document.getElementById('site-sub').textContent;

            const newName = prompt("Nhập Tên Trang Web Mới:", currentName);
            if (newName && newName.trim() !== "") {
                const newSub = prompt("Nhập Mô Tả / Slogan Mới:", currentSub);
                
                document.getElementById('site-name').textContent = newName.trim();
                document.getElementById('page-title').textContent = newName.trim() + ' - Bio Link VIP';
                localStorage.setItem('nsmod_site_name', newName.trim());

                if (newSub !== null) {
                    document.getElementById('site-sub').textContent = newSub.trim();
                    localStorage.setItem('nsmod_site_sub', newSub.trim());
                }

                showToast("Đã đổi tên trang web thành công!", "success");
            }
        }

        function editLogoUrl() {
            if (!isAdmin) return;
            const currentLogo = document.getElementById('site-logo').src;
            const newLogo = prompt("Nhập Link Ảnh (URL) Logo Mới:", currentLogo);

            if (newLogo && newLogo.trim() !== "") {
                document.getElementById('site-logo').src = newLogo.trim();
                document.getElementById('site-favicon').href = newLogo.trim();
                localStorage.setItem('nsmod_site_logo', newLogo.trim());
                showToast("Đã thay đổi Logo web!", "success");
            }
        }

        function loadToolsData() {
            const stored = localStorage.getItem('nsmod_bio_tools');
            if (stored) {
                try { allTools = JSON.parse(stored); } catch(e) { allTools = defaultTools; }
            } else {
                allTools = defaultTools;
                saveToolsData();
            }
            updateTagFilterOptions();
            filterTools();
        }

        function saveToolsData() {
            localStorage.setItem('nsmod_bio_tools', JSON.stringify(allTools));
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            const remember = document.getElementById('remember-me').checked;

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isAdmin = true;
                if (remember) {
                    localStorage.setItem('nsmod_admin_persistent', 'true');
                } else {
                    sessionStorage.setItem('nsmod_admin_active', 'true');
                }
                updateAdminUI();
                closeLoginModal();
                showToast("Đăng nhập Admin thành công!", "success");
            } else {
                showToast("Tài khoản hoặc Mật khẩu không đúng!", "error");
            }
        }

        function handleLogout() {
            isAdmin = false;
            sessionStorage.removeItem('nsmod_admin_active');
            localStorage.removeItem('nsmod_admin_persistent');
            updateAdminUI();
            showToast("Đã đăng xuất tài khoản Admin!", "info");
        }

        function checkAdminSession() {
            if (localStorage.getItem('nsmod_admin_persistent') === 'true' || sessionStorage.getItem('nsmod_admin_active') === 'true') {
                isAdmin = true;
            } else {
                isAdmin = false;
            }
            updateAdminUI();
        }

        function updateAdminUI() {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const adminPanel = document.getElementById('admin-panel');
            const editTitleBtn = document.getElementById('edit-title-btn');
            const editLogoOverlay = document.getElementById('edit-logo-overlay');

            if (isAdmin) {
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                adminPanel.classList.remove('hidden');
                editTitleBtn.classList.remove('hidden');
                editLogoOverlay.classList.remove('hidden');
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
                adminPanel.classList.add('hidden');
                editTitleBtn.classList.add('hidden');
                editLogoOverlay.classList.add('hidden');
            }
            filterTools();
        }

        function filterTools() {
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            const selectedTag = document.getElementById('tag-filter').value;

            const filtered = allTools.filter(tool => {
                const matchSearch = (tool.title || '').toLowerCase().includes(searchKeyword) || 
                                    (tool.desc || '').toLowerCase().includes(searchKeyword);
                
                const matchTag = (selectedTag === 'ALL') || 
                                 (tool.tags && tool.tags.includes(selectedTag));

                return matchSearch && matchTag;
            });

            renderToolsList(filtered);
        }

        function updateTagFilterOptions() {
            const tagSet = new Set();
            allTools.forEach(tool => {
                if (Array.isArray(tool.tags)) {
                    tool.tags.forEach(t => tagSet.add(t.trim().toUpperCase()));
                }
            });

            const tagSelect = document.getElementById('tag-filter');
            const currentSelected = tagSelect.value;
            tagSelect.innerHTML = '<option value="ALL">Tất cả Tags</option>';
            
            tagSet.forEach(tag => {
                if (tag) {
                    const opt = document.createElement('option');
                    opt.value = tag;
                    opt.textContent = tag;
                    tagSelect.appendChild(opt);
                }
            });

            tagSelect.value = currentSelected;
        }

        function getTagStyle(tagUpper) {
            const colors = tagColors[tagUpper];
            if (colors) {
                return `background-color: ${colors.bg}; color: ${colors.text}; border: 1px solid ${colors.border}; shadow-sm`;
            }
            return `background-color: rgba(30, 20, 58, 0.8); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4);`;
        }

        function renderToolsList(toolsList) {
            const container = document.getElementById('tools-container');
            const emptyState = document.getElementById('empty-state');

            container.innerHTML = '';

            if (toolsList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            toolsList.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'cyber-card rounded-2xl p-3.5 flex items-center justify-between gap-3 relative group';

                const tagsHtml = (tool.tags || []).map(tag => {
                    const tagUpper = tag.toUpperCase();
                    const customStyle = getTagStyle(tagUpper);
                    const adminBtn = isAdmin ? `<button onclick="openTagColorModal('${tagUpper}', event)" class="hover:text-white transition-colors ml-0.5 text-[8px]" title="Đổi màu tag này"><i class="fas fa-palette"></i></button>` : '';

                    return `<span class="custom-tag text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm" style="${customStyle}">${tagUpper} ${adminBtn}</span>`;
                }).join(' ');

                const adminActionsHtml = isAdmin ? `
                    <div class="flex items-center gap-1 border-l border-purple-800/50 pl-2 ml-1">
                        <button onclick="editTool('${tool.id}')" class="p-1.5 text-xs text-purple-300 hover:text-white hover:bg-purple-800/40 rounded-lg transition-all" title="Chỉnh sửa">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button onclick="deleteTool('${tool.id}')" class="p-1.5 text-xs text-red-400 hover:text-red-300 hover:bg-red-950/50 rounded-lg transition-all" title="Xóa">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="flex items-center space-x-3 min-w-0 flex-1">
                        <div class="w-12 h-12 rounded-xl bg-purple-950 overflow-hidden flex-shrink-0 border border-purple-500/40 shadow-md">
                            <img src="${tool.img}" alt="${tool.title}" onerror="this.src='https://placehold.co/100x100/322558/ffffff?text=TOOL'" class="w-full h-full object-cover">
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-black text-xs sm:text-sm text-purple-100 truncate tracking-wide uppercase">${tool.title}</h3>
                            <p class="text-[11px] text-purple-300/80 truncate mt-0.5">${tool.desc}</p>
                            <div class="flex flex-wrap gap-1 mt-1.5">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleLike('${tool.id}')" class="heart-btn px-2 py-1.5 text-xs text-purple-400 hover:text-pink-400 transition-colors flex flex-col items-center">
                            <i class="far fa-heart"></i>
                            <span class="text-[9px] text-purple-300/80 font-bold mt-0.5">${tool.likes || 0}</span>
                        </button>
                        <a href="${tool.link}" target="_blank" rel="noopener noreferrer" 
                           class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-pink-500 to-cyan-400 hover:from-purple-500 hover:to-pink-400 text-white flex items-center justify-center transition-all shadow-lg shadow-purple-500/30 transform active:scale-95 flex-shrink-0"
                           title="Mở Link Tải">
                            <i class="fas fa-external-link-alt text-xs"></i>
                        </a>
                        ${adminActionsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openTagColorModal(tagUpper, e) {
            if (e) e.stopPropagation();
            if (!isAdmin) return;

            currentEditingTag = tagUpper;
            document.getElementById('color-target-tag').textContent = tagUpper;

            const current = tagColors[tagUpper] || {
                bg: '#000000',
                text: '#ffffff',
                border: '#a855f7'
            };

            document.getElementById('tag-bg-color').value = current.bg.startsWith('#') ? current.bg : '#000000';
            document.getElementById('tag-bg-text').value = current.bg;

            document.getElementById('tag-text-color').value = current.text.startsWith('#') ? current.text : '#ffffff';
            document.getElementById('tag-text-text').value = current.text;

            document.getElementById('tag-border-color').value = current.border.startsWith('#') ? current.border : '#a855f7';
            document.getElementById('tag-border-text').value = current.border;

            document.getElementById('tag-color-modal').classList.remove('hidden');
        }

        function closeTagColorModal() {
            document.getElementById('tag-color-modal').classList.add('hidden');
            currentEditingTag = "";
        }

        function saveTagColor() {
            if (!currentEditingTag || !isAdmin) return;

            const bg = document.getElementById('tag-bg-text').value.trim();
            const text = document.getElementById('tag-text-text').value.trim();
            const border = document.getElementById('tag-border-text').value.trim();

            tagColors[currentEditingTag] = { bg, text, border };
            saveTagColorsData();
            filterTools();
            closeTagColorModal();
            showToast(`Đã cập nhật màu đồng bộ cho tag "${currentEditingTag}"!`, "success");
        }

        function resetTagColor() {
            if (!currentEditingTag || !isAdmin) return;
            delete tagColors[currentEditingTag];
            saveTagColorsData();
            filterTools();
            closeTagColorModal();
            showToast(`Đã khôi phục màu mặc định cho tag "${currentEditingTag}"!`, "info");
        }

        function toggleLike(id) {
            const tool = allTools.find(t => t.id === id);
            if (!tool) return;
            tool.likes = (tool.likes || 0) + 1;
            saveToolsData();
            filterTools();
        }

        function handleSaveTool(event) {
            event.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('tool-id').value;
            const title = document.getElementById('tool-title').value.trim();
            const desc = document.getElementById('tool-desc').value.trim();
            const img = document.getElementById('tool-img').value.trim();
            const link = document.getElementById('tool-link').value.trim();
            const rawTags = document.getElementById('tool-tags').value;
            
            const tags = rawTags.split(',').map(t => t.replace('#', '').trim().toUpperCase()).filter(t => t.length > 0);

            if (id) {
                const index = allTools.findIndex(t => t.id === id);
                if (index !== -1) {
                    allTools[index] = { ...allTools[index], title, desc, img, link, tags };
                    showToast("Cập nhật tool thành công!", "success");
                }
            } else {
                const newTool = {
                    id: Date.now().toString(),
                    title, desc, img, link, tags,
                    likes: 0
                };
                allTools.unshift(newTool);
                showToast("Đã thêm tool mới thành công!", "success");
            }

            saveToolsData();
            updateTagFilterOptions();
            filterTools();
            closeModal();
        }

        function editTool(id) {
            if (!isAdmin) return;
            const tool = allTools.find(t => t.id === id);
            if (!tool) return;

            document.getElementById('tool-id').value = tool.id;
            document.getElementById('tool-title').value = tool.title || '';
            document.getElementById('tool-desc').value = tool.desc || '';
            document.getElementById('tool-img').value = tool.img || '';
            document.getElementById('tool-link').value = tool.link || '';
            document.getElementById('tool-tags').value = (tool.tags || []).join(', ');

            document.getElementById('modal-title').innerHTML = '<i class="fas fa-edit text-pink-400"></i> Chỉnh Sửa Tool';
            openModal();
        }

        function deleteTool(id) {
            if (!isAdmin) return;
            if (confirm("Bạn có chắc chắn muốn xóa tool này?")) {
                allTools = allTools.filter(t => t.id !== id);
                saveToolsData();
                updateTagFilterOptions();
                filterTools();
                showToast("Đã xóa tool thành công!", "info");
            }
        }

        /* 🚀 HÀM XUẤT CODE DÙNG CHUNG CHUẨN XÁC NGUYÊN BẢN CẢ VẬT LIỆU MỚI */
        function generateCurrentFullHTML() {
            let docStr = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const toolsJson = JSON.stringify(allTools, null, 4);
            const tagColorsJson = JSON.stringify(tagColors, null, 4);

            docStr = docStr.replace(/const defaultTools = \[[\s\S]*?\];/, `const defaultTools = ${toolsJson};`);
            docStr = docStr.replace(/const defaultTagColors = \{[\s\S]*?\};/, `const defaultTagColors = ${tagColorsJson};`);
            return docStr;
        }

        function downloadUpdatedHTML() {
            const htmlContent = generateCurrentFullHTML();
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("Đã tải xuống file index.html mới!", "success");
        }

        function copyUpdatedHTML() {
            const htmlContent = generateCurrentFullHTML();
            navigator.clipboard.writeText(htmlContent).then(() => {
                showToast("Đã sao chép mã HTML chuẩn xác!", "success");
            }).catch(() => {
                showToast("Lỗi sao chép!", "error");
            });
        }

        function openModal() { document.getElementById('tool-modal').classList.remove('hidden'); }
        function closeModal() {
            document.getElementById('tool-modal').classList.add('hidden');
            document.getElementById('tool-form').reset();
            document.getElementById('tool-id').value = '';
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-folder-plus text-pink-400"></i> Thêm Tool / Nội Dung Mới';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-red-400 text-lg';
            } else if (type === 'info') {
                toastIcon.className = 'fas fa-info-circle text-sky-400 text-lg';
            } else {
                toastIcon.className = 'fas fa-check-circle text-emerald-400 text-lg';
            }

            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3000);
        }

        let isPlaying = false;
        function toggleAudio() {
            const audio = document.getElementById('bg-audio');
            const icon = document.getElementById('play-icon');
            if (isPlaying) {
                audio.pause();
                icon.className = 'fas fa-play text-xs';
                isPlaying = false;
            } else {
                audio.play().catch(e => console.log(e));
                icon.className = 'fas fa-pause text-xs';
                isPlaying = true;
            }
        }
    </script>
